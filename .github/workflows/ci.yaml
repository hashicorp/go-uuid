name: Run CI Tests
on:
  push:
    branches:
      - master
    paths-ignore:
      - README.md
      - .gitignore
  pull_request:
    paths-ignore:
      - README.md
      - .gitignore
jobs:
  run-lint:
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Go
        uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231 # v4.0.0
      - name: Setup Go
        uses: hashicorp/setup-golang@v3
        with:
          version-file: go.mod
      - name: Run golangci-lint 
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v1.52.2
          skip-cache: true
  run-tests:
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231 # v4.0.0
      - name: Setup Go
        uses: hashicorp/setup-golang@v3
        with:
          version-file: go.mod
      - name: Run Go Vet
        run: |
          go vet ./...
      - name: Run Go Fmt
        run: |
          files=$(go fmt ./...)
          if [ -n "$files" ]; then
            echo "Please run gofmt on these files ..."
            echo "$files"
            exit 1
          fi
      - name: Run Go Test
        run: |
          go test -race -v ./... -coverprofile=coverage.out
      - name: Run Go Bench
        run: |
          go test -bench . -benchmem -v ./...
      - name: Upload Coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
         path: coverage.out
         name: Coverage-report
      - name: Display coverage report
        run: go tool cover -func=coverage.out
      - name: Build Go
        run: go build ./...
